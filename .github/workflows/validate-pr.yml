name: Validate PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: external-hosted-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  validate-index:
    name: Validate Registry Index
    if: github.event.pull_request.user.id != 5168752
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate index.json
        run: |
          python scripts/validate-index.py

  validate-packages:
    name: Validate Package Metadata
    if: github.event.pull_request.user.id != 5168752
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - example-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema toml tomli packaging

      - name: Validate package
        run: |
          python scripts/validate-package.py packages/${{ matrix.package }}

  check-links:
    name: Check Documentation Links
    if: github.event.pull_request.user.id != 5168752
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
          clean: true

      - name: Check for broken links
        run: |
          # Extract URLs from index.json
          urls=$(python3 -c "
          import json
          with open('index.json') as f:
              data = json.load(f)
          for v in data['verticals']:
              print(v.get('homepage', ''))
              print(v.get('repository', ''))
              print(v.get('documentation', ''))
          " | grep -v '^$')

          # Check each URL
          for url in $urls; do
            echo "Checking $url"
            if ! curl -f -s -o /dev/null "$url"; then
              echo "FAIL: $url is not accessible"
              exit 1
            fi
          done
          echo "All links are accessible"

  lint-markdown:
    name: Lint Markdown Files
    if: github.event.pull_request.user.id != 5168752
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
          clean: true

      - name: Lint markdown with markdownlint
        uses: articulate/actions-markdownlint@17b8abe7407cd17590c006ecc837c35e1ac3ed83 # v1
        with:
          config: .markdownlint.json
          ignore: node_modules

  package-metadata-gate:
    name: Hosted Package Metadata Gate
    if: always() && github.event.pull_request.user.id != 5168752
    needs: validate-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful package validation
        env:
          VALIDATION_RESULT: ${{ needs.validate-packages.result }}
        run: test "${VALIDATION_RESULT}" = "success"
